                semester: 6,
                source_url: "https://put.poznan.pl/cards/2026_2027/Teleinformatyka/stacjonarne/studia pierwszego stopnia/6/Grafika komputerowa (GK).pdf",
              }
        - section: "Metody dydaktyczne"
          content: "1. Wykład: prezentacja multimedialna, uzupełniana aktualnymi przykładami i dodatkowymi\nwyjaśnieniami na tablicy.\n2. Ćwiczenia laboratoryjne: rozwiazywanie zadań, programowanie."
