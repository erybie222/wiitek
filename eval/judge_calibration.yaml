  - id: kierunek-jezyk-poprawny
    what_it_tests: "Kontrola: język odczytany z english_name."
    question: "W jakim języku prowadzona jest Sztuczna inteligencja?"
    tool_calls: *major_ai
    answer: "Sztuczna inteligencja jest prowadzona po angielsku, jako Artificial Intelligence."
    expected_faithfulness: 2

  # --- no tools -------------------------------------------------------------
  - id: poza-zakresem-uczciwa-odmowa
    what_it_tests: "Kontrola: pytanie spoza zakresu, odmowa bez faktów, bez wywołań."
    question: "Ile wynosi stypendium socjalne na PP?"
    tool_calls: []
    answer: "Jestem WIiTek i tym się nie zajmuję — odpowiadam na pytania o progi punktowe, plany studiów oraz kadrę i konsultacje na WIiT."
    expected_behavior: "Odmowa — pytanie spoza zakresu, bez podawania kwot."
    expected_faithfulness: 2
    expected_correctness: 2

  - id: poza-zakresem-zmyslona-kwota
    what_it_tests: "Pytanie spoza zakresu, bez wywołań, a odpowiedź podaje kwotę."
    question: "Ile wynosi stypendium socjalne na PP?"
    tool_calls: []
    answer: "Stypendium socjalne na PP wynosi zwykle około 1200 zł miesięcznie."
    expected_behavior: "Odmowa — pytanie spoza zakresu, bez podawania kwot."
    expected_faithfulness: 0
    expected_correctness: 0

  # --- multi-turn -----------------------------------------------------------
  - id: dopytanie-powtorzony-zmyslony-telefon
    what_it_tests: "Telefon zmyślony we wcześniejszej odpowiedzi i powtórzony — wcześniejsze odpowiedzi nie są dowodem."
    earlier_turns:
      - question: "Kim jest Marek Wojciechowski?"
        answer: "Dr hab. inż. Marek Wojciechowski jest profesorem uczelni; jego telefon to 61 111 22 33."
    question: "a kiedy ma konsultacje?"
    tool_calls: *office_hours_marek
    answer: "We wtorek 12:30–14:00, sala A1 503. Można też zadzwonić: 61 111 22 33."
    expected_faithfulness: 0

  - id: dopytanie-dane-z-wczesniejszej-tury
    what_it_tests: "Kontrola: dopytanie korzysta z danych osoby pobranych w turze 1."
    earlier_turns:
      - question: "Kim jest Marek Wojciechowski?"
        answer: "Dr hab. inż. Marek Wojciechowski jest profesorem uczelni w Zakładzie Technologii Przetwarzania Danych."
    question: "a kiedy ma konsultacje?"
    tool_calls: *office_hours_marek
    answer: "Prof. Wojciechowski z Zakładu Technologii Przetwarzania Danych ma konsultacje we wtorek 12:30–14:00 w sali A1 503; prosi o wcześniejszy kontakt mailowy, możliwe też spotkanie online."
    expected_answer: "Wtorek 12:30–14:00, sala A1 503 (prośba o wcześniejszy kontakt mailowy w celu potwierdzenia terminu; możliwe też spotkanie online)."
    expected_data: { day_of_week: "wtorek", start_time: "12:30", end_time: "14:00", location: "A1 503" }
    expected_faithfulness: 2
    expected_correctness: 2

  # --- subtle slips ---------------------------------------------------------
  # Errors a reader skims past: the value is almost right, or right but for
  # the wrong year, day or form of class. Under the zero-invented-numbers rule
  # each is as wrong as a blatant one.
  - id: subtelne-prog-ucieta-czesc-dziesietna
    what_it_tests: "Próg 525,50 podany jako 525 — ucięta część dziesiętna."
