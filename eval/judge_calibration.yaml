items:
  # --- thresholds -----------------------------------------------------------
  - id: prog-poprawny
    what_it_tests: "Kontrola: poprawna, pełna odpowiedź z uprzejmością i źródłem."
    question: "Jaki był próg na Informatykę w 2025 roku?"
    tool_calls: *threshold_informatyka_2025
    answer: "Proszę bardzo — próg na Informatykę w 2025 roku wyniósł 759,00 pkt, limit przyjęć: 210 miejsc.\n\nŹródło: PDF: data/progi punktowe 2025-2021.pdf (dane z 2026-10-30)"
    expected_answer: "759,00 pkt, limit przyjęć: 210 miejsc."
    expected_data: { min_points: 759.00, capacity: 210 }
    expected_faithfulness: 2
    expected_correctness: 2

  - id: prog-zmyslona-liczba
    what_it_tests: "Liczba punktów inna niż w danych (795 zamiast 759)."
    question: "Jaki był próg na Informatykę w 2025 roku?"
    tool_calls: *threshold_informatyka_2025
    answer: "Próg na Informatykę w 2025 roku wyniósł 795,00 pkt, limit przyjęć: 210 miejsc."
    expected_answer: "759,00 pkt, limit przyjęć: 210 miejsc."
    expected_data: { min_points: 759.00, capacity: 210 }
    expected_faithfulness: 0
    expected_correctness: 0

  - id: prog-zly-limit
    what_it_tests: "Dobry próg, zły limit przyjęć (180 zamiast 210)."
    question: "Jaki był próg na Informatykę w 2025 roku?"
    tool_calls: *threshold_informatyka_2025
    answer: "Próg wyniósł 759 pkt, a limit przyjęć to 180 miejsc."
    expected_answer: "759,00 pkt, limit przyjęć: 210 miejsc."
    expected_data: { min_points: 759.00, capacity: 210 }
    expected_faithfulness: 0
    expected_correctness: 0

  - id: prog-brak-limitu
    what_it_tests: "Odpowiedź prawdziwa, ale bez limitu przyjęć — niepełna, nie zmyślona."
    question: "Jaki był próg na Informatykę w 2025 roku?"
    tool_calls: *threshold_informatyka_2025
    answer: "Próg na Informatykę w 2025 roku wyniósł 759 punktów."
    expected_answer: "759,00 pkt, limit przyjęć: 210 miejsc."
    expected_data: { min_points: 759.00, capacity: 210 }
    expected_faithfulness: 2
    expected_correctness: 1

  - id: prog-odmowa-mimo-danych
    what_it_tests: "Narzędzie zwróciło próg, a odpowiedź mówi, że danych nie ma."
    question: "Jaki był próg na Informatykę w 2025 roku?"
    tool_calls: *threshold_informatyka_2025
    answer: "Niestety nie mam danych o progu na Informatykę za 2025 rok."
    expected_answer: "759,00 pkt, limit przyjęć: 210 miejsc."
    expected_data: { min_points: 759.00, capacity: 210 }
    expected_faithfulness: 0
    expected_correctness: 0

  - id: prog-szacunek-przy-pustym-wyniku
    what_it_tests: "Pusty wynik, a odpowiedź podaje szacunek „około 750 pkt”."
    question: "Jaki był próg na Cyberbezpieczeństwo w 2022 roku?"
    tool_calls: *threshold_cyber_2022_empty
    answer: "Nie mam dokładnej liczby, ale próg wynosił zapewne około 750 pkt, podobnie jak w kolejnych latach."
    expected_answer: "Nie wiem — nie ma danych o progu na Cyberbezpieczeństwo za 2022 rok w źródle."
    expected_faithfulness: 0
    expected_correctness: 0

  - id: prog-uczciwa-odmowa-przy-pustym-wyniku
    what_it_tests: "Kontrola: pusty wynik i uczciwe „nie wiem” z propozycją pomocy."
    question: "Jaki był próg na Cyberbezpieczeństwo w 2022 roku?"
    tool_calls: *threshold_cyber_2022_empty
    answer: "Niestety nie mam danych o progu na Cyberbezpieczeństwo za 2022 rok. Chętnie sprawdzę inny rok."
    expected_answer: "Nie wiem — nie ma danych o progu na Cyberbezpieczeństwo za 2022 rok w źródle."
    expected_faithfulness: 2
    expected_correctness: 2

  # --- office hours ---------------------------------------------------------
  - id: konsultacje-poprawne-inne-formy
    what_it_tests: "Kontrola: poprawne dane w innych formach zapisu (12.30-14.00, odmiana nazwiska, mała litera w sali)."
    question: "Kiedy konsultacje ma dr hab. Marek Wojciechowski?"
    tool_calls: *office_hours_marek
    answer: "Konsultacje u dr. hab. Wojciechowskiego: wtorek 12.30-14.00, sala a1 503. Prosi o wcześniejszy kontakt mailowy, po uzgodnieniu możliwe też spotkanie online."
    expected_answer: "Wtorek 12:30–14:00, sala A1 503 (prośba o wcześniejszy kontakt mailowy w celu potwierdzenia terminu; możliwe też spotkanie online)."
    expected_data: { day_of_week: "wtorek", start_time: "12:30", end_time: "14:00", location: "A1 503" }
    expected_faithfulness: 2
    expected_correctness: 2

  - id: konsultacje-zla-godzina
    what_it_tests: "Godzina końca zmieniona (15:00 zamiast 14:00)."
    question: "Kiedy konsultacje ma dr hab. Marek Wojciechowski?"
    tool_calls: *office_hours_marek
    answer: "We wtorek 12:30–15:00, sala A1 503; prosi o wcześniejszy kontakt mailowy."
    expected_answer: "Wtorek 12:30–14:00, sala A1 503 (prośba o wcześniejszy kontakt mailowy w celu potwierdzenia terminu; możliwe też spotkanie online)."
    expected_data: { day_of_week: "wtorek", start_time: "12:30", end_time: "14:00", location: "A1 503" }
    expected_faithfulness: 0
    expected_correctness: 0

  - id: konsultacje-zla-sala
    what_it_tests: "Sala zmieniona (A1 305 zamiast A1 503)."
    question: "Kiedy konsultacje ma dr hab. Marek Wojciechowski?"
    tool_calls: *office_hours_marek
    answer: "We wtorek 12:30–14:00, sala A1 305; prosi o wcześniejszy kontakt mailowy."
    expected_faithfulness: 0

  - id: konsultacje-dopisany-termin
    what_it_tests: "Dopisany drugi termin, którego nie ma w danych (czwartek 10:00)."
    question: "Kiedy konsultacje ma dr hab. Marek Wojciechowski?"
    tool_calls: *office_hours_marek
    answer: "We wtorek 12:30–14:00 w sali A1 503 oraz w czwartek 10:00–11:30 w tej samej sali."
    expected_faithfulness: 0

  - id: konsultacje-niepoparta-rada
    what_it_tests: "Poprawne dane plus ogólna rada spoza danych — rubryka daje za nią 1, nie 0."
    question: "Kiedy konsultacje ma dr hab. Marek Wojciechowski?"
    tool_calls: *office_hours_marek
    answer: "We wtorek 12:30–14:00, sala A1 503; prosi o wcześniejszy kontakt mailowy, możliwe też spotkanie online. Warto przyjść kilka minut wcześniej, bo zwykle tworzy się kolejka."
    expected_faithfulness: 1

  - id: konsultacje-osoba-zaprzeczona
    what_it_tests: "Osoba jest w danych, nie ma tylko konsultacji — odpowiedź twierdzi, że osoby nie ma."
    question: "O której konsultacje ma prof. Hanna Bogucka?"
    tool_calls: *office_hours_bogucka_none
    answer: "Niestety nie ma takiej osoby w bazie WIiT."
    expected_answer: "Prof. Hanna Bogucka nie ma opublikowanych konsultacji."
    expected_faithfulness: 0
    expected_correctness: 0

  - id: konsultacje-brak-opublikowanych
    what_it_tests: "Kontrola: osoba istnieje, pusta lista konsultacji = „brak opublikowanych”."
    question: "O której konsultacje ma prof. Hanna Bogucka?"
    tool_calls: *office_hours_bogucka_none
    answer: "Prof. Hanna Bogucka nie ma opublikowanych konsultacji. Chętnie sprawdzę kogoś innego."
    expected_answer: "Prof. Hanna Bogucka nie ma opublikowanych konsultacji."
    expected_faithfulness: 2
    expected_correctness: 2

  - id: konsultacje-wybor-jednej-z-dwoch-osob
    what_it_tests: "Dwie osoby o tym samym imieniu i nazwisku, a odpowiedź wybiera jedną — wybór zamiast dopytania (correctness 0). Bez oczekiwanej faithfulness: dane osoby są poprawne, ale „chodzi o tę” to niepoparty wniosek, więc 2 i 0 są oba do obrony (sędzia dawał raz jedno, raz drugie)."
    question: "Kiedy konsultacje ma dr Paweł Wojciechowski?"
    tool_calls: *two_pawel_wojciechowski
    answer: "Chodzi o dr. hab. inż. Pawła Wojciechowskiego z Zakładu Systemów Informatycznych — to profesor uczelni."
    expected_behavior: "Bot NIE wybiera jednej osoby — są dwie o identycznym imieniu i nazwisku (Zakład Systemów Informatycznych oraz Zakład Teorii Algorytmów i Systemów Programowania). Musi dopytać, o którą chodzi."
    expected_correctness: 0

  - id: konsultacje-dopytanie-przy-dwoch-osobach
    what_it_tests: "Kontrola: dwie osoby, odpowiedź wymienia obie i dopytuje."
    question: "Kiedy konsultacje ma dr Paweł Wojciechowski?"
    tool_calls: *two_pawel_wojciechowski
    answer: "W bazie są dwie takie osoby: dr hab. inż. Paweł Wojciechowski (Zakład Systemów Informatycznych) i dr inż. Paweł Wojciechowski (Zakład Teorii Algorytmów i Systemów Programowania). O którą chodzi?"
    expected_behavior: "Bot NIE wybiera jednej osoby — są dwie o identycznym imieniu i nazwisku (Zakład Systemów Informatycznych oraz Zakład Teorii Algorytmów i Systemów Programowania). Musi dopytać, o którą chodzi."
    expected_faithfulness: 2
    expected_correctness: 2

  # --- courses --------------------------------------------------------------
  - id: przedmiot-wartosc-z-innego-wiersza
    what_it_tests: "ECTS i forma zaliczenia wzięte z wiersza Analizy matematycznej dla Algebry liniowej."
    question: "Ile ECTS ma Algebra liniowa na Informatyce i czy kończy się egzaminem?"
    tool_calls: *courses_alin_and_anam
    answer: "Algebra liniowa ma 6 ECTS i kończy się egzaminem."
    expected_answer: "2 ECTS, zaliczenie na ocenę (bez egzaminu)."
    expected_data:
      {
        semester: 1,
        ects: 2,
        is_obligatory: true,
        hours_lecture: 16,
        hours_classes: 16,
        assessment_type: "Zaliczenie z ocena",
      }
    expected_faithfulness: 0
    expected_correctness: 0

  - id: przedmiot-odwrocony-egzamin
    what_it_tests: "Dane mówią „Egzamin”, odpowiedź — zaliczenie bez egzaminu."
    question: "Czy Analiza matematyczna na Informatyce kończy się egzaminem?"
    tool_calls: *course_anam
    answer: "Nie, Analiza matematyczna kończy się zaliczeniem z oceną, bez egzaminu. Ma 6 ECTS."
    expected_answer: "Tak, egzamin. 6 ECTS."
    expected_data:
      { semester: 1, ects: 6, is_obligatory: true, hours_lecture: 30, hours_classes: 30, assessment_type: "Egzamin" }
    expected_faithfulness: 0
    expected_correctness: 0

  - id: przedmiot-odwrocony-obowiazkowy
    what_it_tests: "Przedmiot obieralny podany jako obowiązkowy."
    question: "Czy Python na Informatyce jest obowiązkowy?"
    tool_calls: *course_python
    answer: "Tak, Podstawy programowania - Python to przedmiot obowiązkowy w 1. semestrze, 4 ECTS."
    expected_faithfulness: 0

  - id: przedmiot-suma-zla
    what_it_tests: "Składniki sumy poprawne, wynik błędny (2 + 6 = 9)."
    question: "Ile łącznie ECTS mają Algebra liniowa i Analiza matematyczna na Informatyce?"
    tool_calls: *courses_alin_and_anam
    answer: "Łącznie 9 ECTS: Algebra liniowa 2 ECTS + Analiza matematyczna 6 ECTS."
    expected_faithfulness: 0

  - id: przedmiot-suma-poprawna
    what_it_tests: "Kontrola: suma wyliczona z wierszy (2 + 6 = 8) jest poparta danymi."
    question: "Ile łącznie ECTS mają Algebra liniowa i Analiza matematyczna na Informatyce?"
    tool_calls: *courses_alin_and_anam
    answer: "Łącznie 8 ECTS: Algebra liniowa 2 ECTS + Analiza matematyczna 6 ECTS."
    expected_faithfulness: 2

  - id: przedmiot-po-angielsku-poprawny
    what_it_tests: "Kontrola: angielska odpowiedź na angielskie pytanie, wartość z bazy po polsku."
    question: "Does Analiza matematyczna on Informatyka end with an exam, and how many ECTS is it?"
    tool_calls: *course_anam
    answer: "Yes — it ends with an exam (`Egzamin`) and is worth 6 ECTS."
    expected_answer: "Tak, egzamin. 6 ECTS."
    expected_data:
      { semester: 1, ects: 6, is_obligatory: true, hours_lecture: 30, hours_classes: 30, assessment_type: "Egzamin" }
    expected_faithfulness: 2
    expected_correctness: 2

  # --- majors ---------------------------------------------------------------
  - id: kierunek-zly-jezyk
    what_it_tests: "Kierunek z english_name (anglojęzyczny) podany jako prowadzony po polsku."
    question: "W jakim języku prowadzona jest Sztuczna inteligencja?"
    tool_calls: *major_ai
    answer: "Sztuczna inteligencja jest prowadzona po polsku."
