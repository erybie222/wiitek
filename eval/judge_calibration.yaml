  card_teleinf_3d: &card_teleinf_3d
    - name: search_course_cards
      args: { query: "programowanie efektów 3D", major_name: "Teleinformatyka" }
      result:
        - section: "Treści programowe"
          content: "Wykłady:\n1. Podstawowe operacje matematyczne w grafice trójwymiarowej.\nGeometryczne przekształcenie w przestrzeni 2- i 3-wymiarowej. Matematyczny opis modeli 3D.\nMacierzowy opis przekształceń geometrycznych (translacja, skalowanie, rotacja, rzutowanie).\nOmówienie różnych technik rzutowania.\n2. Podstawowe pojęcia i techniki w grafice trójwymiarowej.\nModele światła, światło kierunkowe, światła rozproszone. Renderowanie modeli kolorowych,\nteksturowanie modeli. Filtrowanie tekstur. Kompresja tekstur, anty-aliasing. Bufor-Z, Bufor\nszablonowy.\n3. Klasyczny potok przetwarzania w grafice komputerowej.\nPrzetwarzanie wierzchołków i prymitywów. Proces rasteryzacji. Interpolacja atrybutów.\n4. Programowalny potok przetwarzania w grafice komputerowej - język opisu wysokiego poziomu.\nProgramy i atrybuty w OpenGL HLSL.\n5. Algorytmy cieniowania i renderowania efektów specjalnych.\nTechniki shadow volume i shadowmaps. Renderowanie portali luster. Bump-mapping.\n6. Zawansowane techniki animacji.\nAnimacje szkieletowe. Systemy cząsteczkowe.\n7. Zastosowania grafiki komputerowej w urządzeniach mobilnych i internecie.\nOpenGL ES, WebGL.\nĆwiczenia laboratoryjne:\n1. Pierwszy program wykorzystujący bibliotekę OpenGL/WebGL. Renderowanie prostych figur\ngeometrycznych.\n2. Wydajne nawigowanie w przestrzeni trójwymiarowej.\n3. Interakcja z przestrzenia trójwymiarowa.\n4. Praca z modelami trójwymiarowymi, ładowanie i wyświetlanie modeli trójwymiarowych.\nZapoznanie z programem Blender.\n5. Teksturowanie modeli.\n6. Cienie w scenie trójwymiarowej. Zaprojektowanie programu do rzucania cienia na obiekty\ntrójwymiarowe.\n7. Oprogramowanie efektów graficznych za pomocą języka shader'ów.\n8. Animacje postaci w formacie MD5."
          last_updated: "2026-11-09T09:57:54.715763+00:00"
          courses:
            - {
                course_code: "S1Teleinf1>GK",
                course_name: "Grafika komputerowa",
                major_name: "Teleinformatyka",
                semester: 6,
                source_url: "https://put.poznan.pl/cards/2026_2027/Teleinformatyka/stacjonarne/studia pierwszego stopnia/6/Grafika komputerowa (GK).pdf",
              }
        - section: "Przedmiotowe efekty uczenia się"
          content: "Wiedza:\n1. Posiada podstawowa wiedze na temat zagadnień związanych z przekształceniami geometrycznymi\nw przestrzeni trójwymiarowej wykorzystywanymi w programowaniu grafiki komputerowej\n2. Zna podstawy programowania układów GPU (procesorów graficznych)\n3. Zna zasady działania i budowę współczesnych układów graficznych. Ma wiedze w zakresie budowy i\nsposobu działania systemów teleinformatycznych służących do świadczenia usług multimedialnych, w\ntym przetwarzania, kompresji i transmisji obrazów.\nUmiejętności:\n1. Potrafi posługiwać się podstawowymi algorytmami obliczeniowymi, strukturami danych i jeżykami\nprogramowania wysokiego poziomu, rozwiązując problemy techniczne związane z grafika\nkomputerowa.\n2. Potrafi wykorzystywać mechanizmy programowania i środowiska programistyczne jeżyków\nobiektowych oraz dostępne oprogramowanie biblioteczne w celu oprogramowania procesorów\ngraficznych.\n3. Potrafi określać podstawowe wymagania dla systemów teleinformatycznych realizujących usługi\nmultimedialne, implementować w systemach multimedialnych najczęściej stosowane efekty grafiki\ntrójwymiarowej oraz projektować systemy transmisji obrazu.\nKompetencje społeczne:\n1. Zna ograniczenia własnej wiedzy i rozumie konieczność jej uaktualniania. Jest otwarty na\nmożliwości ciągłego dokształcania się i podnoszenia kompetencji zawodowych, osobistych i\nspołecznych.\n2. Rozumie wpływ pracy własnej na wyniki zespołu i konieczność podporządkowania się zasadom\npracy w zespole oraz ponoszenia odpowiedzialności za wspólnie realizowane zadania, dostrzega też\nkorzyści płynące z wymiany doświadczeń.\n3. Rozumie znaczenie kształtowania się społeczeństwa informacyjnego dla rozwoju kraju."
          last_updated: "2026-11-09T09:57:54.715763+00:00"
          courses:
            - {
                course_code: "S1Teleinf1>GK",
                course_name: "Grafika komputerowa",
