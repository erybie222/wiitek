      result:
        - section: "Tematyka zajęć"
          content: "Dualizm korpuskularno-falowy: promienie, fale, elektromagnetyzm, kwanty. Polaryzacja światła. Efekty\nelektrooptyczne i akustooptyczne. Wybrane elementy optyki zintegrowanej: falowody planarne, sprzęgacz\nkierunkowy, modulator elektrooptyczny, modulator elektroabsorbcyjny (efekt Franza-Keldysha), modulator\nMacha-Zehndera, modulatory akustooptyczne. Włókna fotoniczne. Rezonatory optyczne.\nPółprzewodnikowe materiały optoelektroniczne, nośniki prądu, pasmowa struktura energetyczna,\npółprzewodniki z prostą i skośną przerwą energetyczną. Oddziaływanie promieniowania z atomami.\nDetekcja i generacja światła w półprzewodnikach. Widmo emisyjne diody LED i diody laserowej.\nWzmacniacze optyczne. Klasyfikacja laserów i ich właściwości. Lasery z synchronizacją modów. Metody\nrealizacji różnych formatów modulacji sygnałów optycznych. Konwersja długości fal. Całkowicie optyczne\nregeneracja sygnałów. Komutacja optyczna.\nĆwiczenia laboratoryjne: wybrane właściwości spektralne LED/LASER, charakterystyki robocze diody LED/\nLASER, analogowy konwerter E/O, cyfrowy konwerter E/O, charakterystyki robocze diody PIN/APD,\nanalogowy konwerter O/E, cyfrowy konwerter O/E, modulator elektrooptyczny, komutator optyczny."
